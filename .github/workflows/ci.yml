name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Committed workflow JSON is what the generator produces
        run: python scripts/build_workflows.py --check
      - name: Workflow validation, Code-node unit tests (node is preinstalled), mock-services API tests
        run: pytest -q

  demo-e2e:
    # Starts n8n 1.123 + the mock service, imports the workflows and fires the demo webhooks: no accounts, no keys.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: bash scripts/import_workflows.sh
      - run: python3 scripts/smoke_demo.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
